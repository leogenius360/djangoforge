[pytest]
# Django settings
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py tests_*.py
python_classes = Test*
python_functions = test_*

# Test discovery
testpaths = apps
norecursedirs = .git .venv venv migrations __pycache__ *.egg-info .pytest_cache .ruff_cache

# Output options
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --reuse-db
    --nomigrations
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-config=pyproject.toml

# Coverage options
[coverage:run]
source = apps
omit =
    */migrations/*
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests
    api: marks tests as API tests
    models: marks tests for model layer
    views: marks tests for view layer
    serializers: marks tests for serializer layer

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Django database
django_find_project = false

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
